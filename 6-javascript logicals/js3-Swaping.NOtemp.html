<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=10;
        let b=20;
        document.write("Before swaping; a="+a+",b="+b+"<br>");
        a=a+b;
        b=a-b;
        a=a-b;
        document.write("After swaping;",a,"",b);
            </script>
    
</body>
