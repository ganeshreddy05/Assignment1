<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Shop | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="login-container">
    <h2>Food <span> World</span></h2>
    <form action="index.html" method="get" class="login-form">
      <input type="text" placeholder="Enter Username" required autofocus>
      <input type="password" placeholder="Enter Password" required>
      <button type="submit" class="btn">Login</button>
    </form>
    <p class="note">Don’t have an account? <a href="#">Sign Up</a></p>
  </div>

</body>
</html>
